name: Fetch Assets Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Fetch data
        run: |
          python fetch_assets.py

      - name: Commit and push data (safe)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json || true
          git add assets.json tickers.json || true
          git status --porcelain
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update market data [skip ci]" || true

          # กัน non-fast-forward: pull --rebase แล้วค่อย push (retry)
          for i in 1 2 3; do
            git pull --rebase origin main || true
            if git push origin main; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push failed, retry $i..."
            sleep $((i*2))
          done
          echo "Push failed after retries."
          exit 1
