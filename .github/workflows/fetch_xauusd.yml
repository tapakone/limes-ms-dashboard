name: Fetch XAUUSD Data (legacy)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Fetch XAUUSD
        run: |
          python fetch_xauusd.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/xauusd_daily.json data/xauusd_15m.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "Update XAUUSD data" && git push)
