<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LIMES MS — Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    :root{
      --bg:#0b0f16;
      --panel:#0f1622cc;
      --panel2:#0f1622ee;
      --gold:#c79a3b;
      --muted:#9aa4b2;
      --good:#20c997;
      --warn:#f5c542;
      --bad:#ff4d4f;
      --line:#1e2a3a;
      --radius:18px;
    }
    html,body{height:100%;margin:0;background:radial-gradient(1200px 600px at 20% 20%, #1b2233 0%, #0b0f16 55%, #070a10 100%);color:#e8eefc;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
    .app{max-width:1200px;margin:0 auto;padding:14px 14px 22px 14px;box-sizing:border-box}

    /* header */
    .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
    .titleWrap{display:flex;flex-direction:column;gap:6px}
    .title{font-size:28px;letter-spacing:1px;font-weight:800}
    .subtitle{color:var(--muted);font-size:13px}
    .rightTop{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
    #stamp{color:var(--muted);font-size:13px;white-space:nowrap}

    .searchRow{display:flex;align-items:center;gap:8px}
    .tickerInput{
      width:min(320px,55vw);
      height:34px;
      border-radius:10px;
      border:1px solid #2a3a52;
      background:#0c1220;
      color:#e8eefc;
      padding:0 10px;
      outline:none;
    }
    .btn{
      height:34px;
      padding:0 12px;
      border-radius:10px;
      border:1px solid #2a3a52;
      background:#111a2a;
      color:#e8eefc;
      cursor:pointer;
      font-weight:700;
    }
    .btn:hover{filter:brightness(1.1)}
    .loadedMeta{color:var(--muted);font-size:12px;text-align:right}

    /* layout */
    .grid{display:grid;grid-template-columns: 1.6fr 0.9fr;gap:14px;align-items:stretch}
    .panel{background:linear-gradient(180deg,var(--panel) 0%, rgba(15,22,34,0.55) 100%);border:1px solid #1b2a3f;border-radius:var(--radius);box-shadow:0 12px 40px rgba(0,0,0,0.35);overflow:hidden}
    .chartPanel{padding:12px 12px 10px 12px;position:relative}
    .legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:6px 0 6px 0}
    .dot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:6px;transform:translateY(1px)}
    .dot.price{background:#f0b44b}
    .dot.mid{background:#4db6ff}
    .dot.band{background:#6e8fb3}
    .dot.today{background:#ffd24d}

    /* IMPORTANT: keep chart height sane (fix "vertical too tall") */
    .chartWrap{height:420px;}
    @media (max-width: 980px){
      .grid{grid-template-columns:1fr}
      .chartWrap{height:360px;}
      .rightTop{align-items:flex-start}
    }
    canvas{width:100% !important;height:100% !important}

    /* side panel */
    .side{padding:12px}
    .cardTitle{color:var(--muted);font-weight:800;font-size:12px;letter-spacing:1px;margin-bottom:8px}
    .badge{
      display:flex;align-items:center;justify-content:center;
      height:54px;border-radius:14px;border:1px solid #273b56;
      background:#0d1524;
      font-weight:900;font-size:22px;letter-spacing:1px;
      margin-bottom:10px;
    }
    .badge.good{background:rgba(32,201,151,0.10);border-color:rgba(32,201,151,0.35);color:var(--good)}
    .badge.warn{background:rgba(245,197,66,0.10);border-color:rgba(245,197,66,0.35);color:var(--warn)}
    .badge.bad{background:rgba(255,77,79,0.10);border-color:rgba(255,77,79,0.35);color:var(--bad)}
    .kv{display:grid;grid-template-columns: 1fr auto;gap:8px;font-size:13px;align-items:center;margin:7px 0}
    .kv .k{color:var(--muted)}
    .kv .v{font-weight:800}

    .barWrap{margin-top:10px}
    .bar{height:10px;border-radius:99px;background:linear-gradient(90deg,#22c55e,#f59e0b,#ef4444);position:relative;overflow:hidden;border:1px solid #233449}
    .barNeedle{position:absolute;top:-2px;width:2px;height:14px;background:#e8eefc;opacity:0.95}

    /* Floating status (single box bottom-right) */
    .floating{
      position:fixed;
      right:14px;
      bottom:14px;
      z-index:999;
      background:rgba(10,14,22,0.92);
      border:1px solid #22344d;
      border-radius:16px;
      padding:10px 12px;
      min-width: 260px;
      box-shadow:0 14px 50px rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
    }
    .floatingTop{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .pill{
      flex:1;
      height:36px;
      border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      font-weight:900;letter-spacing:1px;
      border:1px solid #2a3a52;
      background:#101a2a;
    }
    .pill.good{color:var(--good);border-color:rgba(32,201,151,0.35);background:rgba(32,201,151,0.10)}
    .pill.warn{color:var(--warn);border-color:rgba(245,197,66,0.35);background:rgba(245,197,66,0.10)}
    .pill.bad{color:var(--bad);border-color:rgba(255,77,79,0.35);background:rgba(255,77,79,0.10)}
    .floatingSub{margin-top:6px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:10px}
    .flash{
      animation: flash 0.9s infinite;
    }
    @keyframes flash{
      0%{filter:brightness(1.0)}
      50%{filter:brightness(1.6)}
      100%{filter:brightness(1.0)}
    }
  </style>
</head>

<body>
<div class="app">
  <div class="topbar">
    <div class="titleWrap">
      <div class="title">LIMES MS — <span id="titleTicker">XAUUSD</span></div>
      <div class="subtitle">Daily Close | Forecast vs Actual (+1D)</div>
    </div>

    <div class="rightTop">
      <div class="searchRow">
        <input id="tickerInput" class="tickerInput" list="tickers" placeholder="Type ticker (e.g., NVDA, BTC-USD, CPALL.BK)" value="XAUUSD" />
        <datalist id="tickers">
          <option value="XAUUSD"></option>
          <option value="GC=F"></option>
          <option value="SI=F"></option>

          <option value="AGNC"></option>
          <option value="JEPQ"></option>
          <option value="NVDA"></option>
          <option value="SCHD"></option>
          <option value="TSLA"></option>
          <option value="GOOGL"></option>
          <option value="AMD"></option>
          <option value="JNJ"></option>
          <option value="VOO"></option>
          <option value="QQQ"></option>

          <option value="BTC-USD"></option>
          <option value="ETH-USD"></option>
          <option value="SOL-USD"></option>

          <option value="CPALL.BK"></option>
          <option value="PTT.BK"></option>
          <option value="DELTA.BK"></option>
          <option value="AOT.BK"></option>

          <!-- ถ้าคุณอยากมี "MAG7" แนะนำใช้ ETF ที่มีอยู่จริง เช่น MAGS -->
          <option value="MAGS"></option>
        </datalist>

        <button id="loadBtn" class="btn">Load</button>
      </div>

      <div id="stamp">--</div>
      <div id="loadedMeta" class="loadedMeta">Loaded: --</div>
    </div>
  </div>

  <div class="grid">
    <!-- LEFT: chart -->
    <div class="panel chartPanel">
      <div class="legend">
        <span><span class="dot price"></span>Price</span>
        <span><span class="dot mid"></span>Phase / Mid (MA3)</span>
        <span><span class="dot band"></span>Upper / Lower (±2σ)</span>
        <span><span class="dot today"></span>Today (0)</span>
      </div>

      <div class="chartWrap">
        <canvas id="chart"></canvas>
      </div>
    </div>

    <!-- RIGHT: state -->
    <div class="panel side">
      <div class="cardTitle">STATE</div>
      <div id="stateBadge" class="badge">--</div>

      <div class="kv"><div class="k">Day 0 ref (04:00 TH)</div><div class="v" id="day0ref">--</div></div>
      <div class="kv"><div class="k">Latest (15m)</div><div class="v" id="latest15">--</div></div>
      <div class="kv"><div class="k">Forecast (+1D)</div><div class="v" id="fc1d">--</div></div>
      <div class="kv"><div class="k">Slope</div><div class="v" id="slope">--</div></div>

      <div class="barWrap">
        <div class="kv"><div class="k">Human Risk Index</div><div class="v"><span id="riskScore">--</span> / 5</div></div>
        <div class="bar">
          <div id="riskNeedle" class="barNeedle" style="left:0%"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Floating single status bottom-right -->
<div class="floating" id="floating">
  <div class="floatingTop">
    <div id="pill" class="pill">--</div>
    <div style="font-weight:900;color:#e8eefc;white-space:nowrap" id="pillTicker">XAUUSD</div>
  </div>
  <div class="floatingSub">
    <div>Risk score: <span id="pillScore">--</span>/5</div>
    <div id="pillTime">--</div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
