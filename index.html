<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LIMES MS — Demo (Spec v1)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="title">LIMES MS — DEMO</div>
        <div class="subtitle">Slope Risk (±%) + Position Boost (±2σ)</div>
      </div>

      <div class="picker">
        <label for="assetInput">Asset</label>
        <input id="assetInput" list="assetList" placeholder="พิมพ์: XAUUSD, NVDA, TSLA..." autocomplete="off" />
        <datalist id="assetList"></datalist>
        <button id="loadBtn">Load</button>
      </div>
    </header>

    <main class="grid">
      <section class="card chart">
        <div class="cardHead">
          <div class="legend">
            <span class="dot price"></span> Price
            <span class="dot mid"></span> Mid (MA3)
            <span class="dot band"></span> Upper/Lower (±2σ)
          </div>
          <div id="statusLine" class="statusLine">Ready</div>
        </div>

        <canvas id="c" width="1100" height="520"></canvas>

        <div class="footerBar">
          <div class="pill" id="riskPill">DAY RISK —</div>
          <div class="bigBadge" id="stateBadge">—</div>
        </div>
      </section>

      <aside class="card side">
        <h3>STATE</h3>
        <div class="stateBox" id="stateBox">
          <div class="stateBig" id="stateBig">—</div>
        </div>

        <div class="kv">
          <div class="k">Latest (15m)</div>
          <div class="v" id="latest15">—</div>

          <div class="k">Slope % (Day)</div>
          <div class="v" id="slopeDay">—</div>

          <div class="k">Risk (0–5)</div>
          <div class="v" id="riskScore">—</div>
        </div>

        <h3 style="margin-top:16px;">DAY RISK</h3>
        <div class="bars">
          <div class="barRow">
            <div class="lab">D</div>
            <div class="bar"><div class="fill" id="barD"></div></div>
            <div class="val" id="valD">—</div>
          </div>
          <div class="barRow">
            <div class="lab">2HR</div>
            <div class="bar"><div class="fill" id="bar2h"></div></div>
            <div class="val" id="val2h">—</div>
          </div>
          <div class="barRow">
            <div class="lab">1HR</div>
            <div class="bar"><div class="fill" id="bar1h"></div></div>
            <div class="val" id="val1h">—</div>
          </div>
        </div>

        <div class="hint">
          Flash RED เมื่อ Risk ≥ 4.5 (ชันมากทั้ง +/− หรือใกล้ปลายกรอบ ±2σ)
        </div>
      </aside>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
