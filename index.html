<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LIMES MS – XAUUSD</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="card">
  <h2>LIMES / Mark-S — XAUUSD</h2>

  <canvas id="priceChart"></canvas>

  <div class="panel">
    <div class="row">
      <span>D</span>
      <div class="bar" id="risk-d"></div>
      <span id="score-d"></span>
    </div>
    <div class="row">
      <span>2hr</span>
      <div class="bar" id="risk-2h"></div>
      <span id="score-2h"></span>
    </div>
    <div class="row">
      <span>1hr</span>
      <div class="bar" id="risk-1h"></div>
      <span id="score-1h"></span>
    </div>

    <div class="status" id="statusBox">WATCH</div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
